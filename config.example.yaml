# dl_conn — Example Configuration
# Copy this file to config.yaml and adjust according to your environment.
# Note: Never commit your actual config.yaml containing private keys (nsec).

nostr:
  # Nostr private key (nsec) of the daemon.
  # Can be specified directly here or via nsecFile (recommended with SOPS/secrets).
  # nsec: "nsec1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  nsecFile: "/run/secrets/nostr/dl-conn-key"

  # Relays used for decentralized signaling and DMs.
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
    - "wss://relay.nostr.band"
    - "wss://relay.primal.net"
    - "wss://nostr.mom"

  # Public keys (npub) authorized to request and receive tunnel access.
  # To add one while the daemon is running, without a restart, use:
  #   dl_conn npubs add npub1... --config /path/to/this/file.yaml
  # (see docs/runbook.md). Under NixOS with `services.dl-conn.settings`,
  # this file lives in /nix/store (read-only) — set `configFile` to a
  # writable path under /var/lib/dl-conn instead.
  authorizedNpubs:
    - "npub1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # Fallback to NIP-04 if client does not support NIP-44 (default: false)
  fallbackNip04: false

tunnel:
  # Local port where dl_conn's reverse proxy will listen.
  listenPort: 9099

  # Path to the cloudflared executable (default: "cloudflared").
  cloudflaredPath: "cloudflared"

  # Automatically start cloudflared tunnel on daemon startup (default: true).
  autoStart: true

  # Idle timeout before stopping ephemeral tunnel if no activity occurs.
  inactivityTimeout: "10m"

# Dynamic loopback proxy. Authenticated users can open HTTP services at
# /local/<port>/. Targets are always 127.0.0.1; privileged ports (<1024),
# tunnel.listenPort, and the local diagnostics port are always blocked.
# Add any other host-specific sensitive ports here (SSH/22 is blocked by
# default even though it is already privileged, to keep the policy explicit).
dynamicPorts:
  deniedPorts:
    - 22

auth:
  # Time-to-live for single-use authentication tokens.
  tokenTTL: "120s"

  # Time-to-live for authenticated browser sessions.
  sessionTTL: "4h"

  # Ceiling on how fast one client address may reach /auth, where a token is
  # consumed and a session is minted. Without it, /auth is a token-guessing
  # oracle anyone who can reach the tunnel can hammer.
  rateLimitPerSec: 10
  rateLimitBurst: 20

  # How client addresses reach the daemon log. Absent (or true) writes them
  # anonymized: IPv4 truncated to its network prefix, IPv6 to its first 48
  # bits. Set false to write "[redacted]" and no address at all.
  # logIPs: true

  # Add the CHIPS "Partitioned" attribute to the cookies dl_conn issues. Every
  # ephemeral tunnel shares the trycloudflare.com registrable domain, so an
  # unpartitioned cookie set by one tunnel is offered to every other one.
  # Off by default until CHIPS support is worth relying on.
  # partitionedCookies: true

  # Routes that require a step-up proof (X-Dl-Conn-StepUp, minted at
  # POST /api/auth/stepup, 5-minute window) in addition to the session.
  # Empty — the default — keeps today's behavior: the session alone.
  # stepUpProtected:
  #   - /api/host/telemetry

# Drop-in directory for modular service definitions (*.yaml / *.yml).
# Defaults to <configDir>/services.d if that directory exists.
# Services defined in drop-in files are automatically merged with the list below.
# The daemon monitors this directory and hot-reloads services without restarting
# the process or interrupting active tunnel sessions.
# servicesDir: "/etc/dl-conn/services.d"

# Local services exposed through the reverse proxy.
#
# Per-service keys:
#   id           identifier used in the Nostr protocol and in the frontend.
#   name/icon    what the dashboard shows.
#   description  optional text shown under the name on the dashboard card.
#   prefix       public path this service is mounted under, e.g. "/hass".
#   target       local URL of the backend.
#   stripPrefix  remove the prefix before forwarding (a backend that isn't
#                subpath-aware expects to be at the root of its own paths).
#   websocket    the service uses WebSockets (informational; upgrades are
#                proxied for every service either way).
#   hidden       proxy it, but keep it out of discovery and health status —
#                for extra root-level routes another service's frontend
#                needs, not something the user clicks into.
#   rootPaths    directories the backend serves from its own root but whose
#                frontend asks for at the wrong depth (see the Frigate entry).
#   forwardedFor send X-Forwarded-For to this backend (default: true).
#   originHost   present the request to this backend as if it had arrived
#                directly at it: replaces Host with this authority and drops
#                the browser's Origin/Sec-Fetch-Site (see below).
#
# About forwardedFor: by default dl_conn forwards the visitor's real IP down
# the chain (cloudflared → dl_conn → backend), which is what a reverse proxy
# should do. Some backends refuse the header unless the proxy is on an
# allowlist they keep, and fail every request rather than ignoring it — a
# backend answering "400: Bad Request" to everything when its
# "use_x_forwarded_for"-style option is on and dl_conn's address isn't in its
# trusted-proxy list. The proper fix is on the backend: allowlist the address
# it sees dl_conn coming from.
#
# When that config is out of reach, "forwardedFor: false" makes dl_conn omit
# the header (and drop any the client sent). The cost is that the backend
# sees every request as coming from dl_conn itself, so its logs, rate limits,
# and IP bans all act on that single address instead of on the real visitor.
#
# Backends that don't support a subpath at all (Agent of Empires is the case
# here) serve their whole frontend from the origin root — "/assets/…",
# "/manifest.json", "/theme-bootstrap.js", "/api/…" — so the browser asks for
# those at the root, unaware of the prefix. The proxy tracks which service each
# browser is currently looking at (a "dl_conn_svc" cookie, written when it
# serves a page under a service's prefix) and attributes unmatched root paths to
# it. That is also what settles "/api/…" between Agent of Empires and Frigate's
# hidden route below: it follows whichever of the two the browser is in. Files
# dl_conn's own frontend has always win, and an explicit prefix always wins over
# the cookie, so opening /frigate/ in another tab keeps working.
#
# Available icon names: home, video, camera, router, wifi, server, database,
# dashboard, activity, terminal, code, shield, cloud, globe, music, film, tv,
# hard-drive, cpu, zap, sliders, bell, thermometer, printer, download, lightbulb,
# docker, eye, folder, package (or custom emojis like 🏠, 📹, 💡).
services:
  - id: "frigate"
    name: "Frigate"
    icon: "video"
    prefix: "/frigate"
    target: "http://10.0.66.1:5000"
    stripPrefix: true
    websocket: false
    # Frigate's i18next loadPath is document-relative ("locales/{{lng}}/…"), so
    # the browser resolves it against the current SPA route and asks for the
    # locales directory at the wrong depth (or at the origin root, with no
    # Referer to fall back on). Declaring it routes those requests here and
    # rewrites them back to "/locales/…" whatever the route depth.
    rootPaths:
      - "/locales/"

  # Frigate's own frontend calls its API/WebSocket at the origin root (it
  # doesn't know it's mounted under /frigate) — proxy those root paths
  # straight through to the same backend. "hidden" keeps them out of the
  # discovery list and health status: they aren't a thing to click into,
  # just plumbing the /frigate entry above depends on.
  - id: "frigate-api"
    name: "Frigate API"
    icon: "video"
    prefix: "/api"
    target: "http://10.0.66.1:5000"
    stripPrefix: false
    websocket: false
    hidden: true

  - id: "frigate-ws"
    name: "Frigate WebSocket"
    icon: "video"
    prefix: "/ws"
    target: "http://10.0.66.1:5000"
    stripPrefix: false
    websocket: true
    hidden: true

  - id: "zigbee2mqtt"
    name: "Zigbee2MQTT"
    icon: "router"
    prefix: "/zigbee2mqtt"
    target: "http://10.1.1.10:8080"
    stripPrefix: true

  - id: "pi-web"
    name: "Pi Web"
    icon: "code"
    description: "Interface web do agente Pi"
    prefix: "/pi-web"
    target: "http://127.0.0.1:8584"
    stripPrefix: true
    websocket: true

  - id: "zellij"
    name: "Zellij Web"
    icon: "terminal"
    description: "Terminal web e gerenciador de sessões Zellij"
    prefix: "/zellij"
    target: "http://127.0.0.1:3001"
    stripPrefix: true
    websocket: true

  # About originHost: some backends fence their API on the Host header to
  # defend against DNS rebinding, accepting only their own loopback authority
  # and refusing any request whose Origin names a different origin. Agent of
  # Empires (`aoe serve`) is the known case: its gate trusts loopback, routable
  # IP literals and a non-wildcard --host, so the ephemeral tunnel hostname — a
  # name, and a different one after every restart — is refused. Behind this
  # proxy the browser sends the public tunnel hostname in both headers, so the
  # HTML loads but every API call and the WebSocket upgrade get 403.
  #
  # Naming the backend's own authority satisfies that fence without pinning
  # the tunnel hostname anywhere, which is what makes it work with the
  # ephemeral trycloudflare.com URLs that change on every restart (the
  # alternative, the backend's own --allowed-host flag, would have to be
  # resynced and the backend restarted on every rotation).
  #
  # Dropping Origin is safe for the same reason the backend accepts its
  # absence: reaching this proxy at all requires the dl_conn session cookie,
  # which is SameSite and never rides along on a cross-site request. The
  # public hostname still reaches the backend in X-Forwarded-Host.
  #
  # A backend mounted under a prefix may also redirect to its own root (with a
  # 30x answering the token exchange, for instance); the proxy rewrites such
  # root-absolute Location headers back into the prefix.
  - id: "aoe"
    name: "Agent of Empires"
    icon: "👑"
    description: "Gerenciador web/TUI de sessões do Agent of Empires"
    prefix: "/aoe"
    target: "http://127.0.0.1:25809"
    stripPrefix: true
    # The dashboard streams session state over a WebSocket.
    websocket: true
    # The gate above answers 403 to the tunnel hostname without this.
    originHost: "127.0.0.1:25809"

  # launchTokenFile is the other knob for a backend that prints its own
  # authenticated launch URL: the file holds that URL (token included), and once
  # dl_conn has authenticated the caller it redeems the URL over loopback and
  # forwards only a secure cookie, so the token never crosses the public tunnel
  # nor lands in browser history. Backends with root-relative APIs need Path=/;
  # the proxy strips those auth cookies when forwarding to other services and
  # uses a prefix-scoped marker to migrate legacy cookies. No service below uses
  # it — see ServiceConfig.LaunchTokenFile in internal/config/config.go.
  # launchTokenFile: "/run/<service>/web-url"

# Host telemetry (CPU/RAM/disk/GPU/battery). Disabled by default.
telemetry:
  enabled: false
  intervalSeconds: 10
  retentionDays: 7
  # Include the latest snapshot in Nostr discovery responses so the SPA can
  # render it (required for the host-telemetry card to show any data at all,
  # including on a GitHub Pages copy which has no session to hit /api/host/telemetry).
  exposeViaNostr: false
